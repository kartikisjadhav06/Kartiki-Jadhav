<!DOCTYPE html>
<html>
<head>
    <title>Signup, Login & Password Checker</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .box{
            width:350px;
            margin:50px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        h2{
            text-align:center;
        }

        p{
            text-align:center;
        }

        #loginPage,#homePage{
            display:none;
        }

        #result{
            font-weight:bold;
            font-size:18px;
        }
    </style>

</head>

<body>

<!-- SIGNUP PAGE -->

<div class="box" id="signupPage">

<h2>Sign Up</h2>

<input type="text" id="name" placeholder="Enter Name">

<input type="email" id="signupEmail" placeholder="Enter Email">

<input type="password" id="signupPassword" placeholder="Create Password">

<button onclick="signup()">Sign Up</button>

<p>
Already have an account?
<a href="#" onclick="showLogin()">Login</a>
</p>

</div>

<!-- LOGIN PAGE -->

<div class="box" id="loginPage">

<h2>Login</h2>

<input type="email" id="loginEmail" placeholder="Enter Email">

<input type="password" id="loginPassword" placeholder="Enter Password">

<button onclick="login()">Login</button>

</div>

<!-- HOME PAGE -->

<div class="box" id="homePage">

<h2>Welcome</h2>

<h3>Password Strength Checker</h3>

<input type="password" id="password" placeholder="Enter Password">

<button onclick="checkPassword()">Check Password</button>

<p id="result"></p>

</div>

<script>

// Show Login Page
function showLogin(){

document.getElementById("signupPage").style.display="none";
document.getElementById("loginPage").style.display="block";

}

// Sign Up
function signup(){

let name=document.getElementById("name").value;
let email=document.getElementById("signupEmail").value;
let password=document.getElementById("signupPassword").value;

localStorage.setItem("name",name);
localStorage.setItem("email",email);
localStorage.setItem("password",password);

alert("Signup Successful");

showLogin();

}

// Login
function login(){

let email=document.getElementById("loginEmail").value;
let password=document.getElementById("loginPassword").value;

let savedEmail=localStorage.getItem("email");
let savedPassword=localStorage.getItem("password");

if(email==savedEmail && password==savedPassword){

alert("Login Successful");

document.getElementById("loginPage").style.display="none";
document.getElementById("homePage").style.display="block";

}
else{

alert("Invalid Email or Password");

}

}

// Password Strength Checker
function checkPassword(){

let password=document.getElementById("password").value;
let result=document.getElementById("result");

if(password.length<8){

result.innerHTML="Password should have at least 8 characters";
result.style.color="red";

}

else if(!/[A-Z]/.test(password)){

result.innerHTML="Password should contain an Uppercase Letter";
result.style.color="red";

}

else if(!/[a-z]/.test(password)){

result.innerHTML="Password should contain a Lowercase Letter";
result.style.color="red";

}

else if(!/[0-9]/.test(password)){

result.innerHTML="Password should contain a Number";
result.style.color="red";

}

else if(!/[!@#$%^&*]/.test(password)){

result.innerHTML="Password should contain a Special Character";
result.style.color="red";

}

else{

result.innerHTML="Strong Password ✅";
result.style.color="green";

}

}

</script>

</body>
</html>
