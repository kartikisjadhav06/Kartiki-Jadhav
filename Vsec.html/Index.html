<!DOCTYPE html>
<html>
<head>
    <title>VSEC Practical</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f2f2f2;
        }

        header{
            background:#0077cc;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#333;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:20px;
            cursor:pointer;
        }

        .container{
            text-align:center;
            padding:30px;
        }

        .login-box{
            width:300px;
            margin:30px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            background:#0077cc;
            color:white;
            border:none;
            padding:10px 20px;
            cursor:pointer;
        }

        button:hover{
            background:#005fa3;
        }

        footer{
            background:#333;
            color:white;
            text-align:center;
            padding:10px;
            margin-top:30px;
        }

        #loginPage,
        #welcomePage{
            display:none;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to VSEC Website</h1>
</header>

<nav>
    <a onclick="showHome()">Home</a>
    <a onclick="showLogin()">Login</a>
</nav>

<!-- Home Page -->
<div id="homePage" class="container">
    <h2>Home Page</h2>
    <p>This is the Home Page.</p>

    <button onclick="showLogin()">Go to Login</button>
</div>

<!-- Login Page -->
<div id="loginPage" class="login-box">

    <h2>Login</h2>

    <input type="text" id="username" placeholder="Enter Username">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

</div>

<!-- Welcome Page -->
<div id="welcomePage" class="container">

    <h1>🎉 Login Successful</h1>

    <h2>Welcome to VSEC Website</h2>

    <button onclick="showHome()">Go to Home</button>

</div>

<footer>
    © 2026 VSEC Practical
</footer>

<script>

function showHome(){
    document.getElementById("homePage").style.display="block";
    document.getElementById("loginPage").style.display="none";
    document.getElementById("welcomePage").style.display="none";
}

function showLogin(){
    document.getElementById("homePage").style.display="none";
    document.getElementById("loginPage").style.display="block";
    document.getElementById("welcomePage").style.display="none";
}

function login(){

    var user=document.getElementById("username").value;
    var pass=document.getElementById("password").value;

    if(user=="admin" && pass=="1234"){

        alert("Login Successful");

        document.getElementById("loginPage").style.display="none";
        document.getElementById("welcomePage").style.display="block";

    }

    else{

        alert("Invalid Username or Password");

    }
}

</script>

</body>
</html>
