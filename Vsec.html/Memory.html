<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Card Matching Game</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #74ebd5, #9face6);
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1{
    color: white;
}

.info{
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px;
    font-size: 20px;
    color: white;
    flex-wrap: wrap;
}

button{
    padding: 10px 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover{
    background: #218838;
}

.game-board{
    width: 520px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4,120px);
    gap: 10px;
}

.card{
    width:120px;
    height:120px;
    background:#007BFF;
    color:white;
    font-size:45px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    border-radius:10px;
    transition:0.3s;
    user-select:none;
}

.card:hover{
    transform:scale(1.05);
}

.card.flipped{
    background:white;
    color:black;
    border:2px solid #007BFF;
}

.card.matched{
    background:#28a745;
    color:white;
    cursor:default;
}

#message{
    color:yellow;
    margin-top:20px;
}

@media(max-width:600px){

.game-board{
    width:300px;
    grid-template-columns:repeat(4,70px);
}

.card{
    width:70px;
    height:70px;
    font-size:30px;
}
}
</style>

</head>
<body>

<h1>🧠 Memory Card Matching Game</h1>

<div class="info">
    <p>Moves: <span id="moves">0</span></p>
    <p>Time: <span id="timer">0</span> sec</p>
    <button onclick="restartGame()">Restart</button>
</div>

<div class="game-board" id="gameBoard"></div>

<h2 id="message"></h2>

<script>

const emojis = [
"🍎","🍌","🍇","🍒",
"🍎","🍌","🍇","🍒",
"🐶","🐱","🐼","🐸",
"🐶","🐱","🐼","🐸"
];

let firstCard = null;
let secondCard = null;
let lockBoard = false;
let moves = 0;
let matched = 0;
let seconds = 0;

const board = document.getElementById("gameBoard");

shuffle(emojis);
createBoard();

const timer = setInterval(function(){
    seconds++;
    document.getElementById("timer").innerHTML = seconds;
},1000);

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function createBoard(){

    board.innerHTML="";

    emojis.forEach(function(emoji){

        const card=document.createElement("div");

        card.classList.add("card");

        card.dataset.emoji=emoji;

        card.innerHTML="?";

        card.addEventListener("click",flipCard);

        board.appendChild(card);

    });

}

function flipCard(){

    if(lockBoard) return;

    if(this===firstCard) return;

    if(this.classList.contains("matched")) return;

    this.innerHTML=this.dataset.emoji;

    this.classList.add("flipped");

    if(firstCard===null){

        firstCard=this;
        return;

    }

    secondCard=this;

    moves++;

    document.getElementById("moves").innerHTML=moves;

    checkMatch();

}

function checkMatch(){

    if(firstCard.dataset.emoji===secondCard.dataset.emoji){

        firstCard.classList.add("matched");

        secondCard.classList.add("matched");

        matched+=2;

        resetTurn();

        if(matched===16){

            clearInterval(timer);

            document.getElementById("message").innerHTML=
            "🎉 Congratulations! You Won!<br>" +
            "Moves: "+moves+" | Time: "+seconds+" seconds";

        }

    }

    else{

        lockBoard=true;

        setTimeout(function(){

            firstCard.innerHTML="?";
            secondCard.innerHTML="?";

            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");

            resetTurn();

        },800);

    }

}

function resetTurn(){

    firstCard=null;
    secondCard=null;
    lockBoard=false;

}

function restartGame(){

    location.reload();

}

</script>

</body>
</html>
