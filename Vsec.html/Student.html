<!DOCTYPE html>
<html>
<head>
    <title>Student Details Form</title>
</head>
<body>

    <h2>Student Details Form</h2>

    <form>
        <label>Student Name:</label><br>
        <input type="text" name="name"><br><br>

        <label>Chemistry Marks:</label><br>
        <input type="number" name="chemistry"><br><br>

        <label>Physics Marks:</label><br>
        <input type="number" name="physics"><br><br>

        <label>Mathematics Marks:</label><br>
        <input type="number" name="mathematics"><br><br>

        <input type="submit" value="Submit">
    </form>

    <h2>Student Details</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>Name</th>
            <th>Chemistry</th>
            <th>Physics</th>
            <th>Mathematics</th>
        </tr>
    </table>

</body>
</html>
