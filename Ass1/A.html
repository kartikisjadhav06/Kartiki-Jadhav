<!DOCTYPE html>
<html>
<head>
    <title>Box Hover Effect</title>

    <style>
        .area {
            position: relative;
            margin: 150px auto;
        }

        .boxes {
            width: 200px;
            display: grid;
            grid-template-columns: 100px 100px;
            margin: auto;
        }

        .box {
            width: 100px;
            height: 100px;
            transition: 0.5s;
        }

        .red {
            background: red;
        }

        .blue {
            background: blue;
        }

        .green {
            background: green;
        }

        .yellow {
            background: rgb(251, 255, 0);
        }

        .text {
            position: absolute;
            top: 80px;
            width: 100%;
            text-align: center;
            color: black;
            font-size: 32px;
            font-weight: bold;
            opacity: 0;
            transition: 0.5s;
        }

        .boxes:hover .red,
        .boxes:hover .green {
            transform: translateX(-120px) rotate(-90deg);
        }

        .boxes:hover .blue,
        .boxes:hover .yellow{
            transform: translateX(120px) rotate(90deg);
        }

        .boxes:hover + .text {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="area">

        <div class="boxes">
            <div class="box red"></div>
            <div class="box blue"></div>
            <div class="box green"></div>
            <div class="box yellow"></div>
        </div>

        <div class="text">Hello Kartiki</div>

    </div>

</body>
</html>
