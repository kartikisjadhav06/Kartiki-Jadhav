<!DOCTYPE html>
<html>
<head>

<title>Weather Forecast System</title>

<style>

body{
    font-family: Arial;
    background:#e6f2ff;
}

.container{
    width:350px;
    margin:80px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:#0077cc;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#005999;
}

p{
    text-align:center;
}

#loginPage,#weatherPage{
    display:none;
}


</style>

</head>


<body>


<!-- SIGN UP PAGE -->

<div class="container" id="signupPage">

<h2>Sign Up</h2>


<input type="text" id="signupUsername" placeholder="Enter Username">


<input type="password" id="signupPassword" placeholder="Create Password">


<button onclick="signup()">Sign Up</button>


<p>
Already registered?
<a href="#" onclick="showLogin()">Login</a>
</p>


</div>




<!-- LOGIN PAGE -->


<div class="container" id="loginPage">


<h2>Login</h2>


<input type="text" id="loginUsername" placeholder="Enter Username">


<input type="password" id="loginPassword" placeholder="Enter Password">


<button onclick="login()">Login</button>


<p id="message"></p>


</div>





<!-- WEATHER PAGE -->


<div class="container" id="weatherPage">


<h2>Weather Forecast</h2>


<input type="text" id="city" placeholder="Enter City Name">


<button onclick="checkWeather()">Check Weather</button>


<p id="weatherResult"></p>


</div>





<script>


let username;
let password;



// SIGNUP FUNCTION

function signup(){


username=document.getElementById("signupUsername").value;

password=document.getElementById("signupPassword").value;



if(username=="" || password==""){


alert("Please enter all details");


}

else{


alert("Signup Successful");


document.getElementById("signupPage").style.display="none";

document.getElementById("loginPage").style.display="block";


}


}



// LOGIN PAGE DISPLAY

function showLogin(){


document.getElementById("signupPage").style.display="none";

document.getElementById("loginPage").style.display="block";


}





// LOGIN FUNCTION

function login(){


let loginUsername=document.getElementById("loginUsername").value;

let loginPassword=document.getElementById("loginPassword").value;



if(loginUsername==username && loginPassword==password){


document.getElementById("message").innerHTML="Login Successful";


document.getElementById("loginPage").style.display="none";


document.getElementById("weatherPage").style.display="block";


}

else{


document.getElementById("message").innerHTML=
"Invalid Username or Password";


}


}





// WEATHER FUNCTION


function checkWeather(){


let city=document.getElementById("city").value;


let result=document.getElementById("weatherResult");



if(city==""){


result.innerHTML="Please enter city name";

result.style.color="red";


}



else if(city=="Nashik" || city=="nashik"){


result.innerHTML=
"City : Nashik <br><br>"+
"Temperature : 28°C 🌡️<br>"+
"Weather : Cloudy ☁️<br>"+
"Humidity : 70%";


result.style.color="green";


}



else if(city=="Mumbai" || city=="mumbai"){


result.innerHTML=
"City : Mumbai <br><br>"+
"Temperature : 32°C 🌡️<br>"+
"Weather : Sunny ☀️<br>"+
"Humidity : 65%";


result.style.color="green";


}



else{


result.innerHTML=
"City : "+city+"<br><br>"+
"Temperature : 30°C 🌡️<br>"+
"Weather : Clear Sky ☀️<br>"+
"Humidity : 60%";


result.style.color="green";


}



}



</script>


</body>
</html>
