<!DOCTYPE html>
<html>
<head>
    <title>Student Details Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background-color:white;
        }

        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
        }

        table,th,td{
            border:1px solid black;
        }

        th{
            background-color:green;
            color:white;
        }

        th,td{
            padding:10px;
        }

        button,input[type="submit"],input[type="button"]{
            padding:10px 15px;
            margin:5px;
            cursor:pointer;
        }

        input{
            padding:8px;
        }

        .topper{
            background-color:gold;
            font-weight:bold;
        }
    </style>
</head>

<body>

<h2>Student Details Form</h2>

<h3>Choose Background Color</h3>

<button onclick="changeColor('white')">White</button>
<button onclick="changeColor('lightblue')">Light Blue</button>
<button onclick="changeColor('lightgreen')">Light Green</button>

<br><br>

<form id="studentForm">

<label>Student Name:</label><br>
<input type="text" id="name" required><br><br>

<label>Chemistry Marks:</label><br>
<input type="number" id="chemistry" min="0" max="100" required><br><br>

<label>Physics Marks:</label><br>
<input type="number" id="physics" min="0" max="100" required><br><br>

<label>Mathematics Marks:</label><br>
<input type="number" id="mathematics" min="0" max="100" required><br><br>

<input type="submit" value="Submit">
<input type="button" value="Show Topper" onclick="showTopper()">

</form>

<br><br>

<h2>Student Details</h2>

<table id="studentTable">

<tr>
<th>Name</th>
<th>Chemistry</th>
<th>Physics</th>
<th>Mathematics</th>
<th>Total</th>
<th>Percentage</th>
</tr>

</table>

<script>

let students = [];

document.getElementById("studentForm").addEventListener("submit", function(event){

event.preventDefault();

let name=document.getElementById("name").value;
let chemistry=parseInt(document.getElementById("chemistry").value);
let physics=parseInt(document.getElementById("physics").value);
let mathematics=parseInt(document.getElementById("mathematics").value);

let total=chemistry+physics+mathematics;
let percentage=((total/300)*100).toFixed(2);

students.push({
name:name,
chemistry:chemistry,
physics:physics,
mathematics:mathematics,
total:total,
percentage:percentage
});

let table=document.getElementById("studentTable");

let row=table.insertRow();

row.insertCell(0).innerHTML=name;
row.insertCell(1).innerHTML=chemistry;
row.insertCell(2).innerHTML=physics;
row.insertCell(3).innerHTML=mathematics;
row.insertCell(4).innerHTML=total;
row.insertCell(5).innerHTML=percentage+"%";

alert("Student Added Successfully!");

document.getElementById("studentForm").reset();

});

function showTopper(){

if(students.length==0){
alert("No student data available!");
return;
}

let highest=students[0].total;
let topperIndex=0;

for(let i=1;i<students.length;i++){

if(students[i].total>highest){

highest=students[i].total;
topperIndex=i;

}

}

let rows=document.getElementById("studentTable").rows;

for(let i=1;i<rows.length;i++){

rows[i].classList.remove("topper");

}

rows[topperIndex+1].classList.add("topper");

alert("Topper is : "+students[topperIndex].name+
"\nTotal Marks : "+students[topperIndex].total+
"\nPercentage : "+students[topperIndex].percentage+"%");

}

function changeColor(color){

document.body.style.backgroundColor=color;

}

</script>

</body>
</html>
